name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit and GameTests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Path Filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'gradle/**'
              - '**/*.gradle'
              - 'settings.gradle'
              - 'gradle.properties'
              - 'dependencies.gradle'
              - 'gradlew'
              - 'gradlew.bat'
              - '.github/**'

      - name: Setup Gradle
        if: steps.filter.outputs.code == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"

      - name: Run JVM unit tests
        id: unit-tests
        if: steps.filter.outputs.code == 'true'
        continue-on-error: true
        run: ./gradlew test --no-daemon --stacktrace

      - name: Run GameTests
        id: game-tests
        if: steps.filter.outputs.code == 'true'
        continue-on-error: true
        run: ./gradlew runGameTestServer --no-daemon --stacktrace

      - name: Upload test reports and logs
        if: ${{ always() && steps.filter.outputs.code == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: GregTech-Modern-test-results
          path: |
            build/reports/tests/test/**
            build/test-results/test/**
            run/gametest/logs/**
          if-no-files-found: warn
          retention-days: 15

      - name: Fail when a test suite fails
        if: ${{ steps.unit-tests.outcome == 'failure' || steps.game-tests.outcome == 'failure' }}
        run: exit 1
