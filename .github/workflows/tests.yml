name: Tests

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit and GameTests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Path Filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'gradle/**'
              - '**/*.gradle'
              - 'settings.gradle'
              - 'gradle.properties'
              - 'dependencies.gradle'
              - 'gradlew'
              - 'gradlew.bat'
              - '.github/**'

      - name: Setup Gradle
        if: steps.filter.outputs.code == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"

      - name: Run JVM unit tests
        id: unit-tests
        if: steps.filter.outputs.code == 'true'
        continue-on-error: true
        run: ./gradlew test --no-daemon --stacktrace

      - name: Run GameTests
        id: game-tests
        if: steps.filter.outputs.code == 'true'
        continue-on-error: true
        run: ./gradlew runGameTestServer --no-daemon --stacktrace

      - name: Upload test reports and logs
        if: ${{ always() && steps.filter.outputs.code == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: GregTech-Modern-test-results
          path: |
            build/reports/tests/test/**
            build/test-results/test/**
            run/gametest/logs/**
          if-no-files-found: warn
          retention-days: 15

      - name: Verify GameTests completed and passed
        if: ${{ always() && steps.filter.outputs.code == 'true' }}
        run: |
          LOG_FILE=run/gametest/logs/latest.log
          if [ ! -f "$LOG_FILE" ]; then
            echo "::error::Game test log not found - server likely crashed before tests ran"
            exit 1
          fi
          if ! grep -q "GAME TESTS COMPLETE" "$LOG_FILE"; then
            echo "::error::Game test server did not complete - check logs for startup crash"
            exit 1
          fi
          FAILURES=$(grep -oP '[0-9]+(?= required tests failed)' "$LOG_FILE" || echo "0")
          if [ "$FAILURES" != "0" ]; then
            echo "::error::${FAILURES} required game test(s) failed"
            grep "failed!" "$LOG_FILE" | grep -v "optional"
            exit 1
          fi
          echo "All required game tests passed"

      - name: Fail when a test suite fails
        if: ${{ steps.unit-tests.outcome == 'failure' || steps.game-tests.outcome == 'failure' }}
        run: exit 1
